[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retry-semantics"
version = "0.1.0"
description = "Deterministic controlled environments for retry-semantics experiments"
requires-python = ">=3.11"
dependencies = [
    "groq==1.7.0",
    "httpx==0.28.1",
    "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
